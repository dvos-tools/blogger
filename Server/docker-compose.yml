# Simple Self-Hosted Monitoring Stack (No Sentry!)
# Lightweight: Loki + Grafana + Promtail for log aggregation

services:
  # ────────────────────────────────────────────
  # LOKI - Log Storage
  # ────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    command: -config.file=/etc/loki/local-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  # ────────────────────────────────────────────
  # PROMTAIL - Log Shipper
  # ────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # ────────────────────────────────────────────
  # GRAFANA - Dashboards & Error Visualization
  # ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.1.5
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Security: Require login (default admin/admin)
      # IMPORTANT: Change the admin password on first login!
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      
      # Disable anonymous access (require authentication)
      - GF_AUTH_ANONYMOUS_ENABLED=false
      
      # Optional: Allow user signup (set to false for production)
      - GF_USERS_ALLOW_SIGN_UP=false
      
      # Optional: Disable guest access
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      
      # Optional: Session settings
      - GF_SECURITY_COOKIE_SECURE=false  # Set to true if using HTTPS
      - GF_SESSION_LIFE_TIME=86400  # 24 hours
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:

